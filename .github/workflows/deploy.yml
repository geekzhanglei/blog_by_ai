# ============================================================
# GitHub Actions CI/CD 配置 (参考 beta_mysql/ci.yml 模式)
# 推送仅执行构建校验；生产服务器通过本地 cron 拉取 main 的新提交。
# ============================================================

name: Node.js CI

# 触发条件：main 分支的 push 或 pull_request
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 强制 GitHub Actions 自身的 JS actions 在 Node.js 24 下运行
# （解决 "Node.js 20 actions are deprecated" 警告）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================================
  # 任务 A: 构建校验 (只验证代码能正常安装依赖并构建通过)
  # ==========================================================
  build:
    name: Build Check
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 安装 pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
          run_install: false

      # 3. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # 4. 安装依赖 (--frozen-lockfile 确保版本锁定)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 5. 构建验证 (确保代码可构建，不上传产物)
      - name: Build Astro project
        run: pnpm build
